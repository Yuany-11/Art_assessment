      - 账号管理
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
          description: ''
    patch:
      operationId: accounts_partial_update
      summary: ACC-09 修改账号信息
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - 账号管理
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'
          description: ''
    delete:
      operationId: accounts_destroy
      summary: ACC-10 删除账号
      parameters:
