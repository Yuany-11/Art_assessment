components:
  schemas:
    AccountDeleteResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeleteAccountResult'
        code:
          type: integer
        message:
          type: string
      required:
      - code
      - data
      - message
    AccountDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountItem'
        code:
          type: integer
        message:
          type: string
      required:
      - code
      - data
      - message
    AccountItem:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        realName:
          type: string
        role:
          type: string
        roleName:
          type: string
        orgId:
          type: integer
          nullable: true
        orgName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        studentNo:
          type: string
          nullable: true
        classId:
          type: integer
          nullable: true
        className:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
      required:
      - classId
      - className
      - createdAt
      - email
      - id
      - orgId
      - orgName
      - phone
      - realName
      - role
      - roleName
      - status
      - studentNo
      - subject
      - title
      - username
    AccountListResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountListResponsePage'
        code:
          type: integer
        message:
          type: string
      required:
      - code
      - data
      - message
    AccountListResponsePage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/AccountItem'
        total:
          type: integer
        pages:
          type: integer
      required:
      - list
      - pages
      - total
    AccountStatusEnum:
      enum:
      - active
      - disabled
      type: string
      description: |-
        * `active` - 正常
        * `disabled` - 禁用
    AccountUpdateResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountItem'
        code:
          type: integer
        message:
          type: string
      required:
      - code
      - data
      - message
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - 通过
        * `reject` - 驳回
    AnswerItemRequest:
      type: object
      properties:
        questionId:
          type: integer
          minimum: 1
        answer: {}
        clientUpdatedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - answer
      - questionId
    ApiLoginResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
        code:
          type: integer
        message:
          type: string
      required:
      - code
