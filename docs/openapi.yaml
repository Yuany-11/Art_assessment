        data:
          $ref: '#/components/schemas/UserProfile'
        code:
          type: integer
        message:
          type: string
      required:
      - code
      - data
      - message
    AssessmentCreateRequest:
      type: object
      properties:
        paperId:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 128
        targetType:
          $ref: '#/components/schemas/TargetTypeEnum'
        targetIds:
          type: array
          items:
            type: integer
            minimum: 1
        targetGrades:
          type: array
          items:
            type: integer
            maximum: 12
            minimum: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        attemptLimit:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
        showAnswerMode:
          allOf:
          - $ref: '#/components/schemas/ShowAnswerModeEnum'
          default: after_end
        allowLateSubmit:
          type: boolean
          default: false
        instructions:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
      required:
      - endTime
      - paperId
      - startTime
      - targetIds
      - targetType
      - title
    AttemptStartRequest:
      type: object
      properties:
        deviceType:
          oneOf:
          - $ref: '#/components/schemas/DeviceTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
    AutoRuleRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/QuestionTypeEnum'
        difficulty:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        count:
          type: integer
          maximum: 100
          minimum: 1
        scorePerQuestion:
          type: number
          format: double
          minimum: 0.01
      required:
      - count
      - scorePerQuestion
      - type
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - avatar
      - question_image
      - question_audio
      - student_work
      - certificate
      - import
      - other
      type: string
      description: |-
        * `avatar` - 头像
        * `question_image` - 试题图片
        * `question_audio` - 试题音频
        * `student_work` - 学生作品
        * `certificate` - 证书
        * `import` - 导入文件
        * `other` - 其他
    CertificateGenerateRequest:
      type: object
      properties:
        assessmentId:
          type: integer
          minimum: 1
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        studentIds:
          type: array
          items:
            type: integer
            minimum: 1
        templateId:
          type: integer
          minimum: 1
          nullable: true
        forceRegenerate:
          type: boolean
          default: false
      required:
      - assessmentId
      - subject
    ChangeRequestRequest:
      type: object
      properties:
        targetClassId:
          type: integer
        reason:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - reason
      - targetClassId
    ChapterCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
        sortOrder:
          type: integer
          default: 0
      required:
      - name
    ChapterCreateResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ChapterItem'
        code:
          type: integer
        message:
          type: string
      required:
      - code
      - data
      - message
    ChapterDeleteResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeleteChapterResult'
        code:
          type: integer
        message:
          type: string
      required:
