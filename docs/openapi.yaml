openapi: 3.0.3
info:
  title: 艺术素质测评系统 API
  version: 2.0.0
  description: 艺术素质测评系统后端接口文档（后端 B：模块一、模块二、模块三）
paths:
  /api/v1/accounts:
    get:
      operationId: accounts_list
      summary: ACC-01 查询下级账号列表
      parameters:
      - in: query
        name: classId
        schema:
          type: integer
        description: 班级 ID
      - in: query
        name: keyword
        schema:
          type: string
        description: 账号/姓名/手机号/学籍号
      - in: query
        name: orgId
        schema:
          type: integer
        description: 组织 ID
      - in: query
        name: pageNum
        schema:
          type: integer
      - in: query
        name: pageSize
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
        description: 目标角色
      - in: query
        name: status
        schema:
          type: string
        description: active/disabled
      tags:
      - 账号管理
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
          description: ''
  /api/v1/accounts/{account_id}:
    get:
      operationId: accounts_retrieve
      summary: ACC-02 查询账号详情
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
