        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - 账号管理
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteResponse'
          description: ''
