# ============================================================================
# 艺术素质测评系统 —— 生产 docker-compose（MinIO 已移除，改用本地磁盘）
# ============================================================================
x-backend: &backend
  build:
    context: ./backend
  image: art-assessment-backend:${IMAGE_TAG:-latest}
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_DEBUG: "false"
    DB_HOST: ${DB_HOST:-mysql}
    DB_PORT: ${DB_PORT:-3306}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    FILE_STORAGE: local
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
    DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
  restart: unless-stopped
  networks: [art-net]

services:
  mysql:
    image: mysql:8.0
    container_name: art-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-art_assessment}
      MYSQL_USER: ${DB_USER:-art}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=100
      - --innodb-buffer-pool-size=256M
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    mem_reservation: 384m
    networks: [art-net]

  redis:
    image: redis:7
    container_name: art-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    mem_reservation: 192m
    networks: [art-net]

  # web：唯一跑 migrate + collectstatic + gunicorn
  web:
    <<: *backend
    container_name: art-web
    # 迁移一次 + 收集静态 + 启动 gunicorn（所有参数写一行避免 sh 分行问题）
    command: >-
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 120 --access-logfile - --error-logfile -"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    mem_limit: 384m
    mem_reservation: 256m
    networks: [art-net]

  # worker：不跑 migrate（避免并发死锁）
  worker:
    <<: *backend
    container_name: art-worker
    command: rq worker default --url ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    mem_limit: 256m
    mem_reservation: 160m
    networks: [art-net]

  # scheduler：不跑 migrate
  scheduler:
    <<: *backend
    container_name: art-scheduler
    command: python manage.py runscheduler
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    mem_limit: 192m
    mem_reservation: 96m
    networks: [art-net]

  # v4 音频标签分析服务：仅供 art-net 内网的后端容器调用
  tagger:
    build:
      context: ../music-evaluation
      dockerfile: Dockerfile
    image: art-assessment-tagger:v4-classic
    container_name: art-tagger
    restart: unless-stopped
    environment:
      MODEL_NAME: v4-classic
      MODEL_WEIGHTS: /app/training/runs/v4-classic/best_model.pt
      TORCH_THREADS: "1"
      MAX_UPLOAD_BYTES: "52428800"
      MAX_AUDIO_SECONDS: "600"
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 768m
    mem_reservation: 256m
    networks: [art-net]

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_TITLE: ${VITE_APP_TITLE:-艺术素质测评系统}
    image: art-assessment-frontend:${IMAGE_TAG:-latest}
    container_name: art-frontend
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    mem_limit: 128m
    mem_reservation: 64m
    networks: [art-net]

volumes:
  mysql_data:
  redis_data:
  static_data:
  media_data:

networks:
  art-net:
    driver: bridge
