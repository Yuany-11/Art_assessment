components:
  schemas:
    AnswerItemRequest:
      type: object
      properties:
        questionId:
          type: integer
          minimum: 1
        answer: {}
        clientUpdatedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - answer
      - questionId
    AssessmentCreateRequest:
      type: object
      properties:
        paperId:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 128
        targetType:
          $ref: '#/components/schemas/ScopeTypeEnum'
        targetIds:
          type: array
          items:
            type: integer
            minimum: 1
        targetGrades:
          type: array
          items:
            type: integer
            maximum: 12
            minimum: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        attemptLimit:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
        showAnswerMode:
          allOf:
          - $ref: '#/components/schemas/ShowAnswerModeEnum'
          default: after_end
        allowLateSubmit:
          type: boolean
          default: false
        instructions:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
      required:
      - endTime
      - paperId
      - startTime
      - targetIds
      - targetType
      - title
    AttemptStartRequest:
      type: object
      properties:
        deviceType:
          oneOf:
          - $ref: '#/components/schemas/DeviceTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
    AutoRuleRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/QuestionTypeEnum'
        difficulty:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        count:
          type: integer
          maximum: 100
          minimum: 1
        scorePerQuestion:
          type: number
          format: double
          minimum: 0.01
      required:
      - count
      - scorePerQuestion
      - type
    BlankEnum:
      enum:
      - ''
    CertificateGenerateRequest:
      type: object
      properties:
        assessmentId:
          type: integer
          minimum: 1
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        studentIds:
          type: array
          items:
            type: integer
            minimum: 1
        templateId:
          type: integer
          minimum: 1
          nullable: true
        forceRegenerate:
          type: boolean
          default: false
      required:
      - assessmentId
      - subject
    DeviceTypeEnum:
      enum:
      - web
      - mobile
      - tablet
      type: string
      description: |-
        * `web` - web
        * `mobile` - mobile
        * `tablet` - tablet
    GradingItemRequest:
      type: object
      properties:
        questionId:
          type: integer
          minimum: 1
        score:
          type: number
          format: double
          minimum: 0
        comment:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
      required:
      - questionId
      - score
    ManualScoreItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        score:
          type: number
          format: double
          minimum: 0
        maxScore:
          type: number
          format: double
          minimum: 0.01
      required:
      - maxScore
      - name
      - score
    ManualScoreRequest:
      type: object
      properties:
        studentId:
          type: integer
          minimum: 1
        assessmentId:
          type: integer
          minimum: 1
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        scoreItems:
          type: array
          items:
            $ref: '#/components/schemas/ManualScoreItemRequest'
        totalScore:
          type: number
          format: double
          minimum: 0
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 255
        evidenceFileIds:
          type: array
          items:
            type: integer
            minimum: 1
        overwrite:
          type: boolean
          default: false
      required:
      - assessmentId
      - reason
      - scoreItems
      - studentId
      - subject
    MissingComponentPolicyEnum:
      enum:
      - zero
      - renormalize
      type: string
      description: |-
        * `zero` - 缺项按 0 分
        * `renormalize` - 按剩余权重折算
    PaperAutoCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        paperType:
          $ref: '#/components/schemas/PaperTypeEnum'
        grade:
          type: integer
          maximum: 12
          minimum: 1
        scopeType:
          $ref: '#/components/schemas/ScopeTypeEnum'
        scopeId:
          type: integer
          minimum: 1
        duration:
          type: integer
          maximum: 300
          minimum: 1
        courseIds:
          type: array
          items:
            type: integer
            minimum: 1
        chapterIds:
          type: array
          items:
            type: integer
            minimum: 1
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AutoRuleRequest'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          default: draft
        instructions:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
      required:
      - duration
      - grade
      - paperType
      - rules
      - scopeId
      - scopeType
      - subject
      - title
    PaperManualCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        paperType:
          $ref: '#/components/schemas/PaperTypeEnum'
        grade:
          type: integer
          maximum: 12
          minimum: 1
        scopeType:
          $ref: '#/components/schemas/ScopeTypeEnum'
        scopeId:
          type: integer
          minimum: 1
        duration:
          type: integer
          maximum: 300
          minimum: 1
        instructions:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          default: draft
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionConfigRequest'
      required:
      - duration
      - grade
      - paperType
      - questions
      - scopeId
      - scopeType
      - subject
      - title
    PaperTypeEnum:
      enum:
      - practice
      - formal
      type: string
      description: |-
        * `practice` - 练习卷
        * `formal` - 正式测评卷
    PatchedGradingSubmitRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GradingItemRequest'
        finalize:
          type: boolean
          default: false
        reason:
          type: string
          maxLength: 255
        version:
          type: integer
          minimum: 0
          nullable: true
    PatchedPaperDraftRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        duration:
          type: integer
          maximum: 300
          minimum: 1
        instructions:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionConfigRequest'
    PatchedPaperUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        duration:
          type: integer
          maximum: 300
          minimum: 1
        instructions:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionConfigRequest'
        status:
          $ref: '#/components/schemas/StatusEnum'
    PatchedSaveAnswersRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerItemRequest'
        clientUpdatedAt:
          type: string
          format: date-time
          nullable: true
    PatchedTotalScoreRuleUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        term:
          type: string
          maxLength: 32
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        usualWeight:
          type: number
          format: double
          maximum: 1
          minimum: 0
        formalWeight:
          type: number
          format: double
          maximum: 1
          minimum: 0
        certificateWeight:
          type: number
          format: double
          maximum: 1
          minimum: 0
        usualAggregation:
          $ref: '#/components/schemas/ScoreAggregationEnum'
        formalAggregation:
          $ref: '#/components/schemas/ScoreAggregationEnum'
        certificateAggregation:
          $ref: '#/components/schemas/ScoreAggregationEnum'
        certificateLevelScores:
          type: object
          additionalProperties: {}
        missingPolicy:
          $ref: '#/components/schemas/MissingComponentPolicyEnum'
        excellentLine:
          type: number
          format: double
          maximum: 100
          minimum: 0
        goodLine:
          type: number
          format: double
          maximum: 100
          minimum: 0
        passLine:
          type: number
          format: double
          maximum: 100
          minimum: 0
        note:
          type: string
          maxLength: 1000
    PracticeRandomRequest:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        grade:
          type: integer
          maximum: 12
          minimum: 1
        courseId:
          type: integer
          minimum: 1
        chapterId:
          type: integer
          minimum: 1
        questionCount:
          type: integer
          maximum: 30
          minimum: 1
          default: 10
        difficulty:
          type: integer
          maximum: 5
          minimum: 1
        questionTypes:
          type: array
          items:
            $ref: '#/components/schemas/QuestionTypeEnum'
      required:
      - subject
    QuestionConfigRequest:
      type: object
      properties:
        questionId:
          type: integer
          minimum: 1
        order:
          type: integer
          minimum: 1
        sectionName:
          type: string
          default: ''
          maxLength: 64
        score:
          type: number
          format: double
          minimum: 0.01
      required:
      - order
      - questionId
      - score
    QuestionTypeEnum:
      enum:
      - single_choice
      - multiple_choice
      - true_false
      - fill_blank
      - short_answer
      - listening
      - image_upload
      - audio_upload
      type: string
      description: |-
        * `single_choice` - 单选
        * `multiple_choice` - 多选
        * `true_false` - 判断
        * `fill_blank` - 填空
        * `short_answer` - 简答
        * `listening` - 听赏
        * `image_upload` - 图片作品
        * `audio_upload` - 音频作品
    RegradeRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
        aiReevaluate:
          type: boolean
          default: false
      required:
      - reason
    RuleEvaluateRequest:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        category:
          type: string
          minLength: 1
          maxLength: 32
        level:
          type: integer
          maximum: 10
          minimum: 1
          nullable: true
        maxScore:
          type: number
          format: double
          minimum: 0.01
          default: 100.0
        metrics:
          type: object
          additionalProperties: {}
        confidence:
          type: number
          format: double
          maximum: 1
          minimum: 0
          nullable: true
        evidence:
          type: object
          additionalProperties: {}
      required:
      - category
      - metrics
      - subject
    ScopeTypeEnum:
      enum:
      - class
      - school
      - district
      - city
      - province
      type: string
      description: |-
        * `class` - 班级
        * `school` - 学校
        * `district` - 区县
        * `city` - 市州
        * `province` - 省
    ScoreAggregationEnum:
      enum:
      - average
      - latest
      - best
      type: string
      description: |-
        * `average` - 平均分
        * `latest` - 最近一次
        * `best` - 最高分
    ScoreImportUploadRequest:
      type: object
      description: 仅供 OpenAPI 文档展示上传字段，实际校验使用 Meta 序列化器。
      properties:
        assessmentId:
          type: integer
          minimum: 1
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        overwrite:
          type: boolean
          default: false
        file:
          type: string
          format: binary
          description: CSV/XLSX 文件，最大 10MB
      required:
      - assessmentId
      - subject
    ShowAnswerModeEnum:
      enum:
      - never
      - after_submit
      - after_end
      type: string
      description: |-
        * `never` - 不展示
        * `after_submit` - 交卷后展示
        * `after_end` - 测评结束后展示
    StatusEnum:
      enum:
      - draft
      - ready
      type: string
      description: |-
        * `draft` - draft
        * `ready` - ready
    SubjectEnum:
      enum:
      - music
      - art
      type: string
      description: |-
        * `music` - 音乐
        * `art` - 美术
    SubmitRequest:
      type: object
      properties:
        finalAnswers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerItemRequest'
        submitType:
          allOf:
          - $ref: '#/components/schemas/SubmitTypeEnum'
          default: manual
    SubmitTypeEnum:
      enum:
      - manual
      type: string
      description: '* `manual` - manual'
    TotalScoreRuleCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        term:
          type: string
          maxLength: 32
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        usualWeight:
          type: number
          format: double
          maximum: 1
          minimum: 0
        formalWeight:
          type: number
          format: double
          maximum: 1
          minimum: 0
        certificateWeight:
          type: number
          format: double
          maximum: 1
          minimum: 0
        usualAggregation:
          $ref: '#/components/schemas/ScoreAggregationEnum'
        formalAggregation:
          $ref: '#/components/schemas/ScoreAggregationEnum'
        certificateAggregation:
          $ref: '#/components/schemas/ScoreAggregationEnum'
        certificateLevelScores:
          type: object
          additionalProperties: {}
        missingPolicy:
          $ref: '#/components/schemas/MissingComponentPolicyEnum'
        excellentLine:
          type: number
          format: double
          maximum: 100
          minimum: 0
        goodLine:
          type: number
          format: double
          maximum: 100
          minimum: 0
        passLine:
          type: number
          format: double
          maximum: 100
          minimum: 0
        note:
          type: string
          maxLength: 1000
        subject:
          $ref: '#/components/schemas/SubjectEnum'
        classId:
          type: integer
          minimum: 1
      required:
      - classId
      - name
      - subject
    WithdrawRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - reason
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 在 Authorization 头中传 `Bearer <access_token>`
