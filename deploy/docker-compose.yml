# ============================================================================
# 艺术素质测评系统 —— 生产 docker-compose（单机 ECS 可用）
# 用法：docker compose -f docker-compose.yml --env-file .env up -d
# ============================================================================

x-backend: &backend
  build:
    context: ./backend
  image: art-assessment-backend:${IMAGE_TAG:-latest}
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_DEBUG: "false"
    DB_HOST: ${DB_HOST:-mysql}
    DB_PORT: ${DB_PORT:-3306}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-minio:9000}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
    DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
  restart: unless-stopped
  networks: [art-net]

services:
  # ========== 基础设施 ==========
  mysql:
    image: mysql:8.0
    container_name: art-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-art_assessment}
      MYSQL_USER: ${DB_USER:-art}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=500
    # 生产建议：ECS 上直接映射 3306 到内网；或仅走容器网络不开公网
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/backup:/backup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [art-net]

  redis:
    image: redis:7
    container_name: art-redis
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [art-net]

  minio:
    image: minio/minio:latest
    container_name: art-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9001:9001"   # 控制台只开放本机，用 SSH 隧道访问
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [art-net]

  minio-init:
    image: minio/mc:latest
    container_name: art-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${MINIO_BUCKET:-art-assessment};
      mc anonymous set none local/${MINIO_BUCKET:-art-assessment};
      exit 0;
      "
    networks: [art-net]

  # ========== 后端 ==========
  web:
    <<: *backend
    container_name: art-web
    command: >
      sh -c "
      echo '[web] migrating...' &&
      python manage.py migrate --noinput &&
      echo '[web] collecting static...' &&
      python manage.py collectstatic --noinput &&
      echo '[web] starting gunicorn...' &&
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers ${GUNICORN_WORKERS:-4}
        --threads ${GUNICORN_THREADS:-2}
        --timeout 120
        --access-logfile -
        --error-logfile -"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    networks: [art-net]

  worker:
    <<: *backend
    container_name: art-worker
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      rq worker default --url ${REDIS_URL:-redis://redis:6379/0}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks: [art-net]

  scheduler:
    <<: *backend
    container_name: art-scheduler
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py runscheduler"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks: [art-net]

  # ========== 前端 + Nginx ==========
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_TITLE: ${VITE_APP_TITLE:-艺术素质测评系统}
    image: art-assessment-frontend:${IMAGE_TAG:-latest}
    container_name: art-frontend
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    networks: [art-net]

volumes:
  mysql_data:
  redis_data:
  minio_data:
  static_data:
  media_data:

networks:
  art-net:
    driver: bridge
