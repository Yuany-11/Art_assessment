# ============================================================================
# 艺术素质测评系统 —— Nginx 生产配置
# 路径：/etc/nginx/conf.d/default.conf （容器内）
# 职责：前端静态 + SPA 回退 + 后端 API 代理 + 健康检查
# ============================================================================

upstream art_web_backend {
    server web:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # ---------- 基础 ----------
    client_max_body_size 60m;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ---------- 健康检查（SLB / 云监控用，1 秒响应，不转发到后端） ----------
    location = /health {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    location = /ready {
        access_log off;
        proxy_pass http://art_web_backend/ready;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_send_timeout 2s;
        proxy_set_header Host $host;
    }

    # ---------- 前端静态资源（Vite 产物） ----------
    location /assets/ {
        alias /var/www/frontend/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /favicon.ico {
        alias /var/www/frontend/favicon.ico;
        log_not_found off;
        access_log off;
    }

    # ---------- Django 静态文件 ----------
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------- 媒体文件（上传文件 / 证书） ----------
    location /media/ {
        alias /var/www/media/;
        expires 1d;
        # 下载大文件时限速保护
        limit_rate_after 5m;
        limit_rate 10m;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://art_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # ---------- Django Admin ----------
    location /admin/ {
        proxy_pass http://art_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ---------- 根路径 SPA 回退 ----------
    # 所有未匹配路径（登录、仪表盘等前端路由）都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        root /var/www/frontend;
        index index.html;
        # Vite 构建的 index.html 需要每次都取最新，禁止缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- gzip ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ---------- 日志 ----------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
